[geral]
db_path = clima.db
max_sql_dates_por_lote = 900
download_workers = 3
process_workers = 2
chunk_dias = 30
requests_per_second = 2.0
max_retries = 8
http_timeout = 120
jitter_inicial_max = 5.0
backoff_inicial = 2.0
backoff_maximo = 60.0
min_rps = 0.5
cooldown_429 = 30.0
circuit_limit_429 = 3
espera_min_429 = 5.0
fuso_horario = America/Sao_Paulo
periodo_inicio = 1940-01-01
periodo_fim = 2025-12-31
data_minima_qualidade_ar = 2013-01-01

[urls]
; forecast: disponivel ~92 dias | archive (ERA5): desde 1940
forecast = https://api.open-meteo.com/v1/forecast
archive = https://archive-api.open-meteo.com/v1/archive
; dados recentes com past_days
air_quality = https://air-quality-api.open-meteo.com/v1/air-quality
; sem historico de longo prazo
pollen = https://api.open-meteo.com/v1/pollen

